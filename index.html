// 重み付きランダム選択
function weightedRandom(items){
  const r=Math.random();
  let cum=0;
  for(const {balls,rate} of items){
    cum+=rate;
    if(r<=cum) return balls;
  }
  return items[items.length-1].balls;
}

// ─────────────────────────────────────────────────────────
// 1試行の設計（正しいパチンコモデル）
//
// 【重要な前提】
// ① 通常時: 投資額(yen)を1000円ずつ消化。出玉は通常回転に使わない。
//    （現実: 出玉は右打ちSTで獲得→交換→手元に残る）
// ② 大当り出玉 + RUSH連チャン出玉 を積み上げる
// ③ RUSH終了後は残り投資額で通常回転を続ける
// ④ 最終収支 = 全獲得出玉 × 換金率(yen/玉) - 投資額
//
// 【シミュレーションが表すこと】
// 「この投資額を全部使い切ったとき、どんな収支になるか」
// ・当たれば: 出玉獲得→RUSH突入すれば連チャン→また通常に戻り残額消化
// ・1回も当たらなければ: 出玉ゼロ → 投資額が全損
// ─────────────────────────────────────────────────────────
function oneTrial(m, rotRate, budget, exchangeYen){
  // 通常時の総回転数（投資額から計算、出玉で増えない）
  let remainRots = Math.floor(budget / 1000 * rotRate);

  let totalBalls = 0;   // 獲得出玉の合計（換金対象）
  let rushChains = 0;
  let ltChains   = 0;
  let ballLog    = [];

  // ── 通常時ループ ──────────────────────────────────────
  while(remainRots > 0){
    // 次の大当りまでの回転数（幾何分布）
    // 1回転ずつ判定すると遅いのでまとめてサンプリング
    let rots = 0;
    while(true){
      rots++;
      if(Math.random() < m.prob) break;
    }

    if(rots > remainRots){
      remainRots = 0;
      break; // 残り回転数内に当たらなかった
    }
    remainRots -= rots;

    // ── 初当り ────────────────────────────────────────
    const initBalls = weightedRandom(m.normalPayouts);
    totalBalls += initBalls;
    ballLog.push({type:'初当り', balls:initBalls});

    // RUSH突入判定
    if(Math.random() >= m.rushRate) continue; // 非突入→通常に戻る

    // ── ST/RUSHループ ──────────────────────────────────
    // ※ RUSH中は出玉を積み上げるだけ（右打ち消費は出玉から相殺済みとする）
    let inLT = m.hasLT && (Math.random() < m.ltRate);

    while(true){
      const contRate = inLT ? m.ltContRate : m.rushContRate;
      const payouts  = (inLT && m.ltPayouts.length) ? m.ltPayouts : m.rushPayouts;
      const b = weightedRandom(payouts.length ? payouts : [{balls:1500,rate:1}]);

      totalBalls += b;
      rushChains++;
      if(inLT) ltChains++;
      ballLog.push({type: inLT?'LT':'ST', balls:b});

      if(totalBalls >= 95000){
        // コンプリート上限: 強制終了
        return {totalBalls, rushChains, ltChains, ballLog,
          diffYen: Math.round(totalBalls * exchangeYen - budget)};
      }

      if(Math.random() >= contRate) break; // 非継続→RUSH終了

      // LT昇格チャンス
      if(m.hasLT && !inLT && Math.random() < m.ltRate) inLT = true;
    }
    // RUSH終了後は通常時に戻り、残り回転数を消化
  }

  const diffYen = Math.round(totalBalls * exchangeYen - budget);
  return {totalBalls, rushChains, ltChains, ballLog, diffYen};
}

// メインシミュレーション（10,000試行）
function simulate(m, budget, rotRate, exchangeYen, N=10000){
  const results=[];

  for(let i=0;i<N;i++){
    const t = oneTrial(m, rotRate, budget, exchangeYen);
    results.push(t);
  }

  results.sort((a,b)=>a.diffYen-b.diffYen);
  const n=results.length;
  const pct=p=>results[Math.floor(n*p)].diffYen;
  const mean=results.reduce((s,r)=>s+r.diffYen,0)/n;

  // 出玉パターン集計（プラス試行のみ）
  const plusResults = results.filter(r=>r.diffYen>0);
  const avgRush = plusResults.length>0
    ? plusResults.reduce((s,r)=>s+r.rushChains,0)/plusResults.length : 0;
  const avgLT   = plusResults.length>0
    ? plusResults.reduce((s,r)=>s+r.ltChains,0)/plusResults.length   : 0;

  // 出玉帯の集計（7500発、3000発、1500発など）
  const ballBands = {};
  for(const r of plusResults.slice(0,Math.min(1000,plusResults.length))){
    for(const entry of r.ballLog){
      const k = entry.balls>=6000?'6000↑':entry.balls>=3000?'3000':entry.balls>=1500?'1500':entry.balls>=900?'900':'その他';
      ballBands[k]=(ballBands[k]||0)+1;
    }
  }

  return {
    pct5:pct(0.05), pct25:pct(0.25), median:pct(0.50),
    pct75:pct(0.75), pct90:pct(0.90), pct95:pct(0.95),
    mean:Math.round(mean),
    probPlus: results.filter(r=>r.diffYen>0).length/n,
    probLoss50: results.filter(r=>r.diffYen<=-budget*0.5).length/n,
    probLossAll: results.filter(r=>r.diffYen<=-budget*0.99).length/n,
    prob5k:  results.filter(r=>r.diffYen>=5000).length/n,
    prob10k: results.filter(r=>r.diffYen>=10000).length/n,
    prob20k: results.filter(r=>r.diffYen>=20000).length/n,
    prob50k: results.filter(r=>r.diffYen>=50000).length/n,
    avgRushChains: Math.round(avgRush*10)/10,
    avgLTChains:   Math.round(avgLT*10)/10,
    ballBands,
    trials:n,
    // パーセンタイルごとの試行詳細
    p50detail: results[Math.floor(n*0.50)],
    p90detail: results[Math.floor(n*0.90)],
  };
}

// RUSH継続シミュレーション（現在X連→あとどれくらい続くか）
function simRush(m, currentChain, inLT, N=50000){
  const results=[];
  for(let i=0;i<N;i++){
    let chain=currentChain;
    let lt=inLT;
    let balls=0;
    while(true){
      const cont=lt?m.ltContRate:m.rushContRate;
      if(Math.random()>=cont) break;
      chain++;
      if(lt) {
        const b=weightedRandom(m.ltPayouts.length?m.ltPayouts:[{balls:1500,rate:1}]);
        balls+=b;
      } else {
        const b=weightedRandom(m.rushPayouts.length?m.rushPayouts:[{balls:1500,rate:1}]);
        balls+=b;
      }
      if(!lt&&m.hasLT&&Math.random()<m.ltRate) lt=true;
    }
    results.push({chain,balls});
  }
  results.sort((a,b)=>a.chain-b.chain);
  const n=results.length;
  const pct=p=>results[Math.floor(n*p)];
  return {
    probCont1: results.filter(r=>r.chain>currentChain).length/n,
    probCont3: results.filter(r=>r.chain>=currentChain+3).length/n,
    probCont5: results.filter(r=>r.chain>=currentChain+5).length/n,
    probCont10:results.filter(r=>r.chain>=currentChain+10).length/n,
    p50: pct(0.50), p75: pct(0.75), p90: pct(0.90), p95: pct(0.95),
    trials:n,
  };
}

// 逆算シミュレーション（X円→Y円以上にするには）
function simReverse(m, budget, target, rotRate, exchangeYen, N=10000){
  const targetDiffYen=target-budget; // 必要な収支差（目標到達に必要なプラス分）
  const successResults=[];

  for(let i=0;i<N;i++){
    const t=oneTrial(m,rotRate,budget,exchangeYen);
    // oneTrial内でdiffYen（収支差額）を計算済み
    if(t.diffYen>=targetDiffYen) successResults.push(t);
  }

  const rate=successResults.length/N;

  // 達成試行のパターン分析
  const patterns=[];
  if(successResults.length>0){
    // 7500発以上の当り数
    const avg7500=successResults.reduce((s,r)=>
      s+r.ballLog.filter(b=>b.balls>=7500).length,0)/successResults.length;
    const avg6000=successResults.reduce((s,r)=>
      s+r.ballLog.filter(b=>b.balls>=6000&&b.balls<7500).length,0)/successResults.length;
    const avg3000=successResults.reduce((s,r)=>
      s+r.ballLog.filter(b=>b.balls>=3000&&b.balls<6000).length,0)/successResults.length;
    const avg1500=successResults.reduce((s,r)=>
      s+r.ballLog.filter(b=>b.balls>=1500&&b.balls<3000).length,0)/successResults.length;
    const avgChain=successResults.reduce((s,r)=>s+r.rushChains,0)/successResults.length;
    const avgLT=successResults.reduce((s,r)=>s+r.ltChains,0)/successResults.length;
    const avgBalls=successResults.reduce((s,r)=>s+r.totalBalls,0)/successResults.length;

    return {
      rate, successN:successResults.length,
      avg7500:Math.round(avg7500*10)/10,
      avg6000:Math.round(avg6000*10)/10,
      avg3000:Math.round(avg3000*10)/10,
      avg1500:Math.round(avg1500*10)/10,
      avgChain:Math.round(avgChain*10)/10,
      avgLT:Math.round(avgLT*10)/10,
      avgBalls:Math.round(avgBalls),
      trials:N,
    };
  }
  return {rate:0, successN:0, trials:N};
}

            </div>
          )}

          <div style={{fontSize:11,color:'#3a3a60',textAlign:'center',lineHeight:1.8,paddingTop:4}}>
            ※ 釘状態・入賞ムラにより実際の結果は異なります。<br/>
            ゲーム性の理解のための参考値です。
          </div>
        </div>
      )}
    </div>
  );
}

// ── 画面B: RUSH継続シミュレーション ─────────────────────
function RushScreen(){
  const [machine,setMachine]=useState(null);
  const [chains,setChains]=useState(5);
  const [inLT,setInLT]=useState(false);
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);

  const run=()=>{
    if(!machine) return;
    setLoading(true);setResult(null);
    requestAnimationFrame(()=>setTimeout(()=>{
      const r=simRush(machine,chains,inLT);
      setResult(r);setLoading(false);
    },16));
  };

  return(
    <div style={{flex:1,overflowY:'auto',padding:'16px 16px 60px'}}>
      <div style={{background:'#1a1030',borderRadius:12,padding:'12px 14px',
        border:`1px solid #3a2060`,marginBottom:16,fontSize:12,color:'#b090d0',lineHeight:1.7}}>
        現在RUSH（ST）中の台で「あとどれだけ続くか」を確率で確認できます。<br/>
        <strong style={{color:C.accentL}}>現在X連目</strong>を入力して、今後の継続期待値を計算します。
      </div>

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:8}}>機種</div>
        <MachineSearch value={machine} onSelect={m=>{setMachine(m);setResult(null);}}/>
      </div>

      {machine&&(
        <div style={{background:C.card,borderRadius:10,padding:'10px 14px',
          border:`1px solid ${C.border}`,marginBottom:14}}>
          <SpecBadges m={machine}/>
        </div>
      )}

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:8}}>
          現在の連チャン数（何連目か）
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
          {[1,3,5,8,10,15,20].map(v=>(
            <button key={v} onClick={()=>{setChains(v);setResult(null);}} style={{
              padding:'6px 12px',borderRadius:18,border:'none',fontSize:12,fontWeight:600,
              cursor:'pointer',fontFamily:'inherit',
              background:chains===v?C.accent:C.dim,color:chains===v?'#fff':C.muted}}>
              {v}連
            </button>
          ))}
        </div>
        <input type="number" value={chains}
          onChange={e=>{setChains(Math.max(1,parseInt(e.target.value)||1));setResult(null);}}
          style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
            borderRadius:10,color:C.text,padding:'11px 14px',fontSize:18,fontWeight:700,
            fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
      </div>

      {machine?.hasLT&&(
        <div style={{marginBottom:20}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>
            現在LT中ですか？
          </div>
          <div style={{display:'flex',gap:8}}>
            {[{v:false,l:'STのみ'},{v:true,l:'LT中'}].map(({v,l})=>(
              <button key={l} onClick={()=>{setInLT(v);setResult(null);}} style={{
                flex:1,padding:'10px',borderRadius:10,border:'none',fontSize:13,fontWeight:600,
                cursor:'pointer',fontFamily:'inherit',
                background:inLT===v?C.accent:C.dim,color:inLT===v?'#fff':C.muted}}>
                {l}
              </button>
            ))}
          </div>
        </div>
      )}

      <Btn onClick={run} disabled={!machine||loading} size='lg' full>
        {loading?'⏳ 計算中…':machine?`${chains}連目からの継続確率を計算`:' 機種を選択してください'}
      </Btn>

      {result&&machine&&(
        <div style={{marginTop:20}}>
          <div style={{background:'#1a1030',borderRadius:12,padding:'12px 14px',
            marginBottom:14,border:`1px solid ${C.border}`,fontSize:12,color:C.muted}}>
            現在 <strong style={{color:C.accentL}}>{chains}連目</strong>
            {inLT&&<strong style={{color:C.gold}}>（LT中）</strong>}。
            継続率 <strong style={{color:C.text}}>
              {pct(inLT?machine.ltContRate:machine.rushContRate)}
            </strong> での今後の展開予測（50,000回試行）
          </div>

          <div style={{background:C.card,borderRadius:12,padding:'14px',
            marginBottom:14,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:12}}>継続確率</div>
            <Bar value={result.probCont1} max={1} color={C.green}
              label="あと1回以上続く確率" sub={pct(result.probCont1)}/>
            <Bar value={result.probCont3} max={1} color={C.accentL}
              label="あと3回以上続く確率" sub={pct(result.probCont3)}/>
            <Bar value={result.probCont5} max={1} color={C.gold}
              label="あと5回以上続く確率" sub={pct(result.probCont5)}/>
            <Bar value={result.probCont10} max={1} color='#f97316'
              label="あと10回以上続く確率" sub={pct(result.probCont10)}/>
          </div>

          <div style={{background:C.card,borderRadius:12,padding:'14px',
            border:`1px solid ${C.border}`,marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:12}}>
              今後の期待出玉（今の連チャン以降）
            </div>
            {[
              {label:'中央値（50%のケース）',d:result.p50,color:C.accentL},
              {label:'上位25%（かなり好運）',d:result.p75,color:C.green},
              {label:'上位10%（大フィーバー）',d:result.p90,color:C.gold},
              {label:'上位5%（神展開）',d:result.p95,color:'#f59e0b'},
            ].map(({label,d,color})=>(
              <div key={label} style={{display:'flex',justifyContent:'space-between',
                alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${C.dim}`}}>
                <span style={{fontSize:12,color:C.muted}}>{label}</span>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:15,fontWeight:700,color,fontFamily:'JetBrains Mono,monospace'}}>
                    {fmtB(d.balls)}
                  </div>
                  <div style={{fontSize:10,color:C.muted}}>追加{d.chain-chains}連</div>
                </div>
              </div>
            ))}
          </div>

          <div style={{fontSize:11,color:'#3a3a60',textAlign:'center',lineHeight:1.8}}>
            ※ 各連チャンは独立試行です。過去の連数は今後の確率に影響しません。
          </div>
        </div>
      )}
    </div>
  );
}

// ── 画面C: 逆算シミュレーション ─────────────────────────
function ReverseScreen(){
  const [machine,setMachine]=useState(null);
  const [budget,setBudget]=useState(5000);
  const [target,setTarget]=useState(50000);
  const [rotRate,setRotRate]=useState(18);
  const [exKey,setExKey]=useState('touka');
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);

  const ex=EXCHANGES.find(e=>e.key===exKey);

  const run=()=>{
    if(!machine||target<=budget) return;
    setLoading(true);setResult(null);
    requestAnimationFrame(()=>setTimeout(()=>{
      const r=simReverse(machine,budget,target,rotRate,ex.yen);
      setResult(r);setLoading(false);
    },16));
  };

  return(
    <div style={{flex:1,overflowY:'auto',padding:'16px 16px 60px'}}>
      <div style={{background:'#1a0a30',borderRadius:12,padding:'12px 14px',
        border:`1px solid #3a1060`,marginBottom:16,fontSize:12,color:'#c090e0',lineHeight:1.7}}>
        <strong style={{color:'#e0b0ff'}}>「手持ちX円 → 目標Y円」</strong>を達成できる確率と、<br/>
        達成した試行で<strong style={{color:'#e0b0ff'}}>実際にどんな出玉パターンが起きたか</strong>を分析します。
      </div>

      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:8}}>機種</div>
        <MachineSearch value={machine} onSelect={m=>{setMachine(m);setResult(null);}}/>
      </div>

      {/* 現在の手持ち */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:8}}>
          現在の手持ち（投資額）
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
          {[2000,3000,5000,8000,10000,15000,20000].map(v=>(
            <button key={v} onClick={()=>{setBudget(v);setResult(null);}} style={{
              padding:'5px 10px',borderRadius:18,border:'none',fontSize:11,fontWeight:600,
              cursor:'pointer',fontFamily:'inherit',
              background:budget===v?'#7c3aed':C.dim,color:budget===v?'#fff':C.muted}}>
              ¥{v>=10000?v/10000+'万':v.toLocaleString()}
            </button>
          ))}
        </div>
        <input type="number" value={budget}
          onChange={e=>{setBudget(Math.max(500,parseInt(e.target.value)||0));setResult(null);}}
          style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
            borderRadius:10,color:C.text,padding:'11px 14px',fontSize:18,fontWeight:700,
            fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
      </div>

      {/* 目標金額 */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:8}}>
          目標金額（この金額以上にしたい）
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
          {[10000,20000,30000,50000,100000].map(v=>(
            <button key={v} onClick={()=>{setTarget(v);setResult(null);}} style={{
              padding:'5px 10px',borderRadius:18,border:'none',fontSize:11,fontWeight:600,
              cursor:'pointer',fontFamily:'inherit',
              background:target===v?C.gold:C.dim,color:target===v?'#000':C.muted}}>
              ¥{v>=10000?v/10000+'万':v.toLocaleString()}
            </button>
          ))}
        </div>
        <input type="number" value={target}
          onChange={e=>{setTarget(Math.max(budget+1000,parseInt(e.target.value)||0));setResult(null);}}
          style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
            borderRadius:10,color:C.gold,padding:'11px 14px',fontSize:18,fontWeight:700,
            fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
        {budget>0&&target>budget&&(
          <div style={{fontSize:12,color:C.muted,marginTop:6}}>
            必要な増加: <strong style={{color:C.gold}}>¥{(target-budget).toLocaleString()}</strong>
            （{Math.round((target/budget-1)*100)}%増）
          </div>
        )}
      </div>

      {/* 実測回転率 */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:6}}>
          実測回転率（回/k）
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <input type="number" step="0.1" value={rotRate}
            onChange={e=>{setRotRate(parseFloat(e.target.value)||0);setResult(null);}}
            style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,
              borderRadius:10,color:C.text,padding:'11px 14px',fontSize:18,fontWeight:700,
              fontFamily:'JetBrains Mono,monospace',outline:'none'}}/>
          <span style={{fontSize:14,color:C.muted,flexShrink:0}}>回/k</span>
        </div>
      </div>

      {/* 換金率 */}
      <div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,letterSpacing:'.06em',marginBottom:8}}>換金率</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {EXCHANGES.map(e=>(
            <button key={e.key} onClick={()=>{setExKey(e.key);setResult(null);}} style={{
              padding:'6px 10px',borderRadius:18,border:'none',fontSize:11,fontWeight:600,
              cursor:'pointer',fontFamily:'inherit',
              background:exKey===e.key?C.accent:C.dim,color:exKey===e.key?'#fff':C.muted}}>
              {e.label}
            </button>
          ))}
        </div>
      </div>

      <Btn onClick={run} disabled={!machine||loading||target<=budget} size='lg' full
        color='#7c3aed'>
        {loading?'⏳ 計算中（約1秒）…':
          machine?`¥${budget.toLocaleString()} → ¥${target.toLocaleString()} の達成パターンを解析`:
          '機種を選択してください'}
      </Btn>

      {result&&machine&&(
        <div style={{marginTop:20}}>
          {/* 達成確率 */}
          <div style={{background:result.rate>0.1?'#0a1a10':'#1a0a0a',
            borderRadius:14,padding:'16px',marginBottom:14,
            border:`1px solid ${result.rate>0.1?C.green:C.red}44`,textAlign:'center'}}>
            <div style={{fontSize:12,color:C.muted,marginBottom:8}}>
              {machine.short} で ¥{budget.toLocaleString()} → ¥{target.toLocaleString()} を達成する確率
            </div>
            <div style={{fontSize:52,fontWeight:900,
              color:result.rate>0.2?C.green:result.rate>0.1?C.gold:C.red,
              fontFamily:'JetBrains Mono,monospace',lineHeight:1}}>
              {pct(result.rate)}
            </div>
            <div style={{fontSize:12,color:C.muted,marginTop:8}}>
              10,000回試行中 {result.successN}回 達成
            </div>
          </div>

          {result.successN>0?(
            <>
              {/* 達成時の出玉パターン */}
              <div style={{background:C.card,borderRadius:12,padding:'14px',
                marginBottom:14,border:`1px solid ${C.border}`}}>
                <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:4}}>
                  ✅ 達成した試行の出玉パターン（平均）
                </div>
                <div style={{fontSize:11,color:C.muted,marginBottom:12}}>
                  ¥{budget.toLocaleString()} → ¥{target.toLocaleString()}以上になった{pct(result.rate)}の試行では…
                </div>

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
                  <NumCard label="平均総連チャン数" value={`${result.avgChain}連`}
                    color={C.accentL} sub="ST合計"/>
                  {result.avgLT>0&&(
                    <NumCard label="うちLT連チャン" value={`${result.avgLT}連`}
                      color={C.gold} sub="LT合計"/>
                  )}
                  <NumCard label="平均総獲得出玉" value={fmtB(result.avgBalls)}
                    color={C.green}/>
                </div>

                {/* 出玉パターン詳細 */}
                <div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:10}}>
                  当り出玉の内訳（達成試行の平均）
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:0}}>
                  {[
                    ...(result.avg7500>0?[{label:'7,500発以上の大当り',val:result.avg7500,color:'#fbbf24'}]:[]),
                    ...(result.avg6000>0?[{label:'6,000発の大当り',val:result.avg6000,color:C.gold}]:[]),
                    ...(result.avg3000>0?[{label:'3,000発の大当り',val:result.avg3000,color:C.green}]:[]),
                    ...(result.avg1500>0?[{label:'1,500発の大当り',val:result.avg1500,color:C.accentL}]:[]),
                  ].map(({label,val,color})=>(
                    <div key={label} style={{display:'flex',alignItems:'center',
                      padding:'10px 0',borderBottom:`1px solid ${C.dim}`}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color}}>{label}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontSize:20,fontWeight:900,color,
                          fontFamily:'JetBrains Mono,monospace'}}>
                          平均 {val}回
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{marginTop:14,background:'#0e0e28',borderRadius:8,
                  padding:'10px 12px',fontSize:12,color:C.muted,lineHeight:1.8}}>
                  💡 つまり <strong style={{color:C.text}}>¥{budget.toLocaleString()}→¥{target.toLocaleString()}</strong> を達成するには、<br/>
                  {result.avg3000>0&&<>平均して <strong style={{color:C.green}}>3,000発を約{result.avg3000}回</strong><br/></>}
                  {result.avg7500>0&&<>うち <strong style={{color:'#fbbf24'}}>7,500発以上を約{result.avg7500}回</strong><br/></>}
                  <strong style={{color:C.accentL}}>合計{result.avgChain}連前後</strong>が必要なことが多い。
                </div>
              </div>
            </>
          ):(
            <div style={{background:'#1a0a0a',borderRadius:12,padding:20,
              textAlign:'center',color:C.muted}}>
              10,000回試行中、達成した試行が0回でした。<br/>
              目標金額を下げるか、別の機種を選んでください。
            </div>
          )}

          <div style={{fontSize:11,color:'#3a3a60',textAlign:'center',lineHeight:1.8,marginTop:8}}>
            ※ 統計的参考値です。実際の遊技結果を保証しません。
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// メインアプリ（タブ切替）
// ═══════════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState('sim');

  const tabs=[
    {key:'sim',   icon:'📊', label:'投資分析'},
    {key:'rush',  icon:'🔥', label:'RUSH継続'},
    {key:'rev',   icon:'💹', label:'逆算'},
  ];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',
      background:C.bg,overflow:'hidden'}}>
      {/* ヘッダー */}
      <div style={{padding:'12px 16px 10px',borderBottom:`1px solid ${C.border}`,
        flexShrink:0,background:'linear-gradient(180deg,#0e0e2a,#07071a)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22}}>🎰</span>
          <div>
            <div style={{fontSize:18,fontWeight:900,letterSpacing:'-.5px'}}>PachiScope</div>
            <div style={{fontSize:10,color:C.muted}}>パチンコ期待値シミュレーター</div>
          </div>
        </div>
      </div>

      {/* タブ */}
      <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,
        background:C.surface,flexShrink:0}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)} style={{
            flex:1,padding:'10px 4px',border:'none',cursor:'pointer',
            fontFamily:'inherit',fontSize:12,fontWeight:tab===t.key?700:400,
            background:'transparent',
            color:tab===t.key?C.accentL:C.muted,
            borderBottom:`2px solid ${tab===t.key?C.accent:'transparent'}`,
            transition:'color .2s'}}>
            <div style={{fontSize:18}}>{t.icon}</div>
            <div style={{marginTop:2}}>{t.label}</div>
          </button>
        ))}
      </div>

      {/* コンテンツ */}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {tab==='sim'  && <SimScreen/>}
        {tab==='rush' && <RushScreen/>}
        {tab==='rev'  && <ReverseScreen/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(App)
);
</script>
</body>
