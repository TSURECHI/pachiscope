// ═══════════════════════════════════════════════════════════
// シミュレーションエンジン（正しいパチンコモデル）
//
// 前提:
// ① 通常時: 投資額から計算した「総回転数」だけを消化
//    出玉は通常回転に使わない（右打ち中は別管理）
// ② 初当り→RUSH突入→連チャン出玉を積み上げ→RUSH終了後また通常に戻る
// ③ 最終収支 = 全獲得出玉 × 換金率 - 投資額
// ═══════════════════════════════════════════════════════════

function wRand(payouts){ // 重み付きランダム
  let r=Math.random(),c=0;
  for(const p of payouts){c+=p.r; if(r<=c) return p.b;}
  return payouts[payouts.length-1].b;
}

function oneTrial(m, rotRate, budget, exchangeYen){
  let remainRots = Math.floor(budget / 1000 * rotRate); // 総回転数
  let totalBalls = 0, rushChains=0, ltChains=0;
  const log=[];

  while(remainRots>0){
    // 次の初当りまでの回転数（幾何分布）
    let rots=0;
    while(true){rots++; if(Math.random()<m.prob) break;}
    if(rots>remainRots){remainRots=0; break;}
    remainRots-=rots;

    // 初当り出玉
    const nb=wRand(m.normalPayouts);
    totalBalls+=nb;
    log.push({type:'初当り',balls:nb});

    // RUSH突入判定
    if(Math.random()>=m.rushRate) continue;

    // RUSH/LTループ
    let inLT=m.hasLT&&(Math.random()<m.ltRate);
    while(true){
      const cr=inLT?m.ltContRate:m.rushContRate;
      const pay=(inLT&&m.ltPayouts.length)?m.ltPayouts:m.rushPayouts;
      const b=wRand(pay);
      totalBalls+=b; rushChains++;
      if(inLT) ltChains++;
      log.push({type:inLT?'LT':'ST',balls:b});
      if(totalBalls>=95000) return {totalBalls,rushChains,ltChains,log,
        diffYen:Math.round(95000*exchangeYen-budget)};
      if(Math.random()>=cr) break;
      if(m.hasLT&&!inLT&&Math.random()<m.ltRate) inLT=true;
    }
  }
  return {totalBalls,rushChains,ltChains,log,
    diffYen:Math.round(totalBalls*exchangeYen-budget)};
}

function simulate(m, budget, rotRate, exYen, N=10000){
  const R=[];
  for(let i=0;i<N;i++) R.push(oneTrial(m,rotRate,budget,exYen));
  R.sort((a,b)=>a.diffYen-b.diffYen);
  const n=R.length;
  const p=q=>R[Math.floor(n*q)].diffYen;
  const mean=R.reduce((s,r)=>s+r.diffYen,0)/n;
  const plus=R.filter(r=>r.diffYen>0);
  return{
    pct5:p(.05),pct25:p(.25),median:p(.50),pct75:p(.75),pct90:p(.90),pct95:p(.95),
    mean:Math.round(mean),
    probPlus:plus.length/n,
    probLossAll:R.filter(r=>r.diffYen<=-budget*.99).length/n,
    probLossHalf:R.filter(r=>r.diffYen<=-budget*.5).length/n,
    prob5k:R.filter(r=>r.diffYen>=5000).length/n,
    prob10k:R.filter(r=>r.diffYen>=10000).length/n,
    prob20k:R.filter(r=>r.diffYen>=20000).length/n,
    prob50k:R.filter(r=>r.diffYen>=50000).length/n,
    avgChains:plus.length>0?Math.round(plus.reduce((s,r)=>s+r.rushChains,0)/plus.length*10)/10:0,
    avgLT:plus.length>0?Math.round(plus.reduce((s,r)=>s+r.ltChains,0)/plus.length*10)/10:0,
    // 典型ケース（中央・90%ile）のログ
    medianLog:R[Math.floor(n*.50)].log,
    p90Log:R[Math.floor(n*.90)].log,
    budget,rotRate,exchangeYen:exYen,trials:n,
  };
}

// 逆算: 全機種ランキング形式
function simAllForTarget(budget,target,rotRate,exYen,N=5000){
  return MACHINES.map(m=>{
    const R=[];
    for(let i=0;i<N;i++) R.push(oneTrial(m,rotRate,budget,exYen));
    const need=target-budget;
    const rate=R.filter(r=>r.diffYen>=need).length/N;
    const success=R.filter(r=>r.diffYen>=need);
    const avgC=success.length>0?Math.round(success.reduce((s,r)=>s+r.rushChains,0)/success.length*10)/10:0;
    const avgLT=success.length>0?Math.round(success.reduce((s,r)=>s+r.ltChains,0)/success.length*10)/10:0;
    // 達成時の出玉内訳
    let avg7500=0,avg3000=0,avg1500=0;
    if(success.length>0){
      avg7500=Math.round(success.reduce((s,r)=>s+r.log.filter(l=>l.balls>=7500).length,0)/success.length*10)/10;
      avg3000=Math.round(success.reduce((s,r)=>s+r.log.filter(l=>l.balls>=3000&&l.balls<7500).length,0)/success.length*10)/10;
      avg1500=Math.round(success.reduce((s,r)=>s+r.log.filter(l=>l.balls>=1500&&l.balls<3000).length,0)/success.length*10)/10;
    }
    return{m,rate,avgChains:avgC,avgLT,avg7500,avg3000,avg1500,successN:success.length};
  }).sort((a,b)=>b.rate-a.rate);
}

// RUSH継続シミュレーション
function simRush(m,current,inLT,N=50000){
  const R=[];
  for(let i=0;i<N;i++){
    let chain=current,lt=inLT,balls=0;
    while(true){
      const cr=lt?m.ltContRate:m.rushContRate;
      if(Math.random()>=cr) break;
      chain++;
      const pay=(lt&&m.ltPayouts.length)?m.ltPayouts:m.rushPayouts;
      balls+=wRand(pay);
      if(m.hasLT&&!lt&&Math.random()<m.ltRate) lt=true;
    }
    R.push({chain,balls});
  }
  R.sort((a,b)=>a.chain-b.chain);
  const n=R.length;
  const p=q=>R[Math.floor(n*q)];
  return{
    probCont1:R.filter(r=>r.chain>current).length/n,
    probCont3:R.filter(r=>r.chain>=current+3).length/n,
    probCont5:R.filter(r=>r.chain>=current+5).length/n,
    probCont10:R.filter(r=>r.chain>=current+10).length/n,
    p50:p(.50),p75:p(.75),p90:p(.90),p95:p(.95),
  };
}

        <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>各結果になる確率</div>
        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
          「全額溶ける」= ¥{budget.toLocaleString()}投資して出玉ゼロで終わる展開
        </div>
        <Bar v={res.probPlus} label="プラス収支になる確率" sub={fp(res.probPlus)} color={C.accentL}/>
        <Bar v={res.prob5k}   label="+5,000円以上になる確率"  sub={fp(res.prob5k)}  color={C.green}/>
        <Bar v={res.prob10k}  label="+10,000円以上"          sub={fp(res.prob10k)} color={C.green}/>
        <Bar v={res.prob20k}  label="+20,000円以上"          sub={fp(res.prob20k)} color='#34d399'/>
        <Bar v={res.prob50k}  label="+50,000円以上"          sub={fp(res.prob50k)} color={C.gold}/>
        <div style={{marginTop:8,borderTop:`1px solid ${C.dim}`,paddingTop:8}}>
          <Bar v={res.probLossHalf} label={`半額以上(¥${(budget/2).toLocaleString()}以上)溶ける確率`} sub={fp(res.probLossHalf)} color='#f87171'/>
          <Bar v={res.probLossAll}  label={`全額(¥${budget.toLocaleString()})溶ける確率`} sub={fp(res.probLossAll)}  color={C.red}/>
        </div>
      </div>

      {/* 典型的な展開の可視化 */}
      <div style={{background:C.card,borderRadius:12,padding:'14px',marginBottom:12,border:`1px solid ${C.border}`}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>典型的な展開の内訳</div>
        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
          10,000回試行した中の実際の展開例。どんな当りが起きてこの収支になったか。
        </div>
        <PlayLog log={res.medianLog} label="中央値ケース（最も多い典型的な展開）"
          budget={budget} exYen={res.exchangeYen}/>
        <PlayLog log={res.p90Log} label="上位10%ケース（かなり恵まれた展開）"
          budget={budget} exYen={res.exchangeYen}/>
      </div>

      {res.avgChains>0&&<div style={{background:C.card,borderRadius:12,padding:'14px',
        marginBottom:12,border:`1px solid ${C.border}`}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>プラス収支になった試行の平均連チャン数</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div style={{background:C.dim,borderRadius:8,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:10,color:C.muted}}>平均ST連数</div>
            <div style={{fontSize:20,fontWeight:900,color:C.accentL,fontFamily:'JetBrains Mono,monospace'}}>{res.avgChains}連</div>
          </div>
          {res.avgLT>0&&<div style={{background:C.dim,borderRadius:8,padding:'8px 10px',textAlign:'center'}}>
            <div style={{fontSize:10,color:C.muted}}>うちLT連数</div>
            <div style={{fontSize:20,fontWeight:900,color:C.gold,fontFamily:'JetBrains Mono,monospace'}}>{res.avgLT}連</div>
          </div>}
        </div>
      </div>}

      <div style={{fontSize:11,color:'#3a3a60',textAlign:'center',lineHeight:1.8,paddingTop:4}}>
        ※ 統計的参考値です。実際の結果を保証しません。<br/>
        釘状態・入賞ムラにより実際の回転率は変動します。
      </div>
    </div>}
  </div>;
}

// ── 画面B: RUSH継続 ────────────────────────────────────────
function RushScreen(){
  const [m,setM]=useState(null);
  const [chains,setChains]=useState(5);
  const [inLT,setInLT]=useState(false);
  const [res,setRes]=useState(null);
  const [loading,setLoading]=useState(false);

  const run=()=>{
    if(!m) return;
    setLoading(true);setRes(null);
    requestAnimationFrame(()=>setTimeout(()=>{
      setRes(simRush(m,chains,inLT));
      setLoading(false);
    },16));
  };

  return<div style={{flex:1,overflowY:'auto',padding:'16px 16px 60px'}}>
    <div style={{background:'#1a1030',borderRadius:12,padding:'11px 14px',
      border:`1px solid #3a2060`,marginBottom:14,fontSize:12,color:'#b090d0',lineHeight:1.7}}>
      現在RUSH中の台で「あとどれだけ続くか」を確率計算します。<br/>
      <strong style={{color:C.accentL}}>現在何連目か</strong>を入力してください。
    </div>
    <div style={{marginBottom:14}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>機種</div>
      <MSearch value={m} onSelect={x=>{setM(x);setRes(null);}}/>
    </div>
    {m&&<div style={{background:C.card,borderRadius:10,padding:'10px 14px',
      border:`1px solid ${C.border}`,marginBottom:14,display:'flex',gap:8,flexWrap:'wrap'}}>
      {[{l:fp(m.rushContRate),s:'ST継続率'},
        ...(m.hasLT?[{l:fp(m.ltContRate),s:'LT継続率',lt:true}]:[])
      ].map(b=><div key={b.s} style={{background:b.lt?C.gold+'22':C.dim,borderRadius:7,padding:'6px 10px',textAlign:'center'}}>
        <div style={{fontSize:14,fontWeight:900,color:b.lt?C.gold:C.text,fontFamily:'JetBrains Mono,monospace'}}>{b.l}</div>
        <div style={{fontSize:9,color:C.muted}}>{b.s}</div>
      </div>)}
    </div>}
    <div style={{marginBottom:14}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>現在の連チャン数</div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
        {[1,3,5,8,10,15,20].map(v=><button key={v} onClick={()=>{setChains(v);setRes(null);}} style={{
          padding:'5px 10px',borderRadius:16,border:'none',fontSize:11,fontWeight:600,
          cursor:'pointer',fontFamily:'inherit',
          background:chains===v?C.accent:C.dim,color:chains===v?'#fff':C.muted}}>{v}連</button>)}
      </div>
      <input type="number" value={chains}
        onChange={e=>{setChains(Math.max(1,parseInt(e.target.value)||1));setRes(null);}}
        style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
          borderRadius:10,color:C.text,padding:'11px 14px',fontSize:18,fontWeight:700,
          fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
    </div>
    {m?.hasLT&&<div style={{marginBottom:20}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>現在LT中？</div>
      <div style={{display:'flex',gap:8}}>
        {[{v:false,l:'ST中'},{v:true,l:'LT中'}].map(x=><button key={x.l}
          onClick={()=>{setInLT(x.v);setRes(null);}} style={{flex:1,padding:'10px',
            borderRadius:10,border:'none',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',
            background:inLT===x.v?C.accent:C.dim,color:inLT===x.v?'#fff':C.muted}}>{x.l}</button>)}
      </div>
    </div>}
    <Btn ch={loading?'⏳ 計算中…':m?`${chains}連目からの継続確率を計算`:'機種を選択してください'}
      onClick={run} disabled={!m||loading} size='lg' full/>
    {res&&m&&<div style={{marginTop:20}}>
      <div style={{background:'#1a1030',borderRadius:12,padding:'11px 14px',
        marginBottom:12,border:`1px solid ${C.border}`,fontSize:12,color:C.muted,lineHeight:1.7}}>
        {chains}連目{inLT?'（LT中）':''}から継続率{fp(inLT?m.ltContRate:m.rushContRate)}で計算（50,000回試行）
      </div>
      <div style={{background:C.card,borderRadius:12,padding:'14px',marginBottom:12,border:`1px solid ${C.border}`}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>継続確率</div>
        <Bar v={res.probCont1}  label="あと1回以上続く確率"   sub={fp(res.probCont1)}  color={C.green}/>
        <Bar v={res.probCont3}  label="あと3回以上続く確率"   sub={fp(res.probCont3)}  color={C.accentL}/>
        <Bar v={res.probCont5}  label="あと5回以上続く確率"   sub={fp(res.probCont5)}  color={C.gold}/>
        <Bar v={res.probCont10} label="あと10回以上続く確率"  sub={fp(res.probCont10)} color='#f97316'/>
      </div>
      <div style={{background:C.card,borderRadius:12,padding:'14px',border:`1px solid ${C.border}`}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>今後の期待出玉（今の連チャン以降）</div>
        {[{l:'中央値（50%）',d:res.p50,c:C.accentL},{l:'上位25%',d:res.p75,c:C.green},
          {l:'上位10%',d:res.p90,c:C.gold},{l:'上位5%（神展開）',d:res.p95,c:'#f59e0b'},
        ].map(r=><div key={r.l} style={{display:'flex',justifyContent:'space-between',
          padding:'7px 0',borderBottom:`1px solid ${C.dim}`}}>
          <span style={{fontSize:12,color:C.muted}}>{r.l}</span>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:15,fontWeight:700,color:r.c,fontFamily:'JetBrains Mono,monospace'}}>{fb(r.d.balls)}</div>
            <div style={{fontSize:10,color:C.muted}}>追加{r.d.chain-chains}連</div>
          </div>
        </div>)}
      </div>
    </div>}
  </div>;
}

// ── 画面C: 逆算ランキング ──────────────────────────────────
function ReverseScreen(){
  const [budget,setBudget]=useState(5000);
  const [target,setTarget]=useState(50000);
  const [rot,setRot]=useState(18);
  const [exK,setExK]=useState('touka');
  const [res,setRes]=useState(null);
  const [loading,setLoading]=useState(false);
  const ex=EXCHANGES.find(e=>e.key===exK);
  const [expanded,setExpanded]=useState(null);

  const run=()=>{
    if(target<=budget) return;
    setLoading(true);setRes(null);setExpanded(null);
    requestAnimationFrame(()=>setTimeout(()=>{
      setRes(simAllForTarget(budget,target,rot,ex.yen,5000));
      setLoading(false);
    },16));
  };

  const tc={甘デジ:'#10b981',ライト:'#06b6d4',ライトミドル:'#6366f1',ミドル:'#f59e0b',
    ライトハイミドル:'#f97316',ハイミドル:'#ef4444',超ハイミドル:'#dc2626'};

  return<div style={{flex:1,overflowY:'auto',padding:'16px 16px 60px'}}>
    <div style={{background:'#1a0a30',borderRadius:12,padding:'11px 14px',
      border:`1px solid #3a1060`,marginBottom:14,fontSize:12,color:'#c090e0',lineHeight:1.7}}>
      <strong style={{color:'#e0b0ff'}}>¥X → ¥Y</strong>を達成できる確率を<strong style={{color:'#e0b0ff'}}>全機種ランキング形式</strong>で表示します。<br/>
      達成した場合にどんな出玉パターンが必要かも分析します。
    </div>

    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>手持ち（投資額）</div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
        {[2000,3000,5000,8000,10000,15000,20000].map(v=>
          <button key={v} onClick={()=>{setBudget(v);setRes(null);}} style={{
            padding:'4px 9px',borderRadius:16,border:'none',fontSize:11,fontWeight:600,
            cursor:'pointer',fontFamily:'inherit',
            background:budget===v?C.accent:C.dim,color:budget===v?'#fff':C.muted}}>
            ¥{v>=10000?v/10000+'万':v.toLocaleString()}</button>)}
      </div>
      <input type="number" value={budget}
        onChange={e=>{setBudget(Math.max(500,parseInt(e.target.value)||0));setRes(null);}}
        style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
          borderRadius:10,color:C.text,padding:'10px 14px',fontSize:16,fontWeight:700,
          fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
    </div>

    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:8}}>目標金額</div>
      <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:8}}>
        {[10000,20000,30000,50000,100000].map(v=>
          <button key={v} onClick={()=>{setTarget(v);setRes(null);}} style={{
            padding:'4px 9px',borderRadius:16,border:'none',fontSize:11,fontWeight:600,
            cursor:'pointer',fontFamily:'inherit',
            background:target===v?C.gold:C.dim,color:target===v?'#000':C.muted}}>
            ¥{v/10000}万</button>)}
      </div>
      <input type="number" value={target}
        onChange={e=>{setTarget(Math.max(budget+1000,parseInt(e.target.value)||0));setRes(null);}}
        style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
          borderRadius:10,color:C.gold,padding:'10px 14px',fontSize:16,fontWeight:700,
          fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
      {target>budget&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>
        必要増加: <strong style={{color:C.gold}}>¥{(target-budget).toLocaleString()}</strong>
        （{Math.round((target/budget-1)*100)}%増）
      </div>}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:20}}>
      <div>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>実測回転率</div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <input type="number" step="0.1" value={rot}
            onChange={e=>{setRot(parseFloat(e.target.value)||0);setRes(null);}}
            style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,
              borderRadius:10,color:C.text,padding:'10px 12px',fontSize:16,fontWeight:700,
              fontFamily:'JetBrains Mono,monospace',outline:'none'}}/>
          <span style={{color:C.muted,fontSize:12,flexShrink:0}}>回/k</span>
        </div>
      </div>
      <div>
        <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6}}>換金率</div>
        <select value={exK} onChange={e=>{setExK(e.target.value);setRes(null);}}
          style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,
            borderRadius:10,color:C.text,padding:'10px 10px',fontSize:12,
            outline:'none',fontFamily:'inherit',appearance:'none'}}>
          {EXCHANGES.map(e=><option key={e.key} value={e.key}>{e.label}</option>)}
        </select>
      </div>
    </div>

    <Btn ch={loading?`⏳ 全${MACHINES.length}機種を計算中…（約3秒）`:`全${MACHINES.length}機種でランキングを生成`}
      onClick={run} disabled={loading||target<=budget} size='lg' full color='#7c3aed'/>

    {res&&<div style={{marginTop:20}}>
      <div style={{fontSize:12,color:C.muted,marginBottom:12}}>
        ¥{budget.toLocaleString()} → ¥{target.toLocaleString()} 達成確率ランキング
        （各機種5,000回試行 · 回転率{rot}回/k · {ex.label}）
      </div>
      {res.map((r,i)=>{
        const color=r.rate>=0.20?C.green:r.rate>=0.10?C.gold:r.rate>=0.05?C.accentL:C.muted;
        const exp=expanded===r.m.id;
        return<div key={r.m.id} style={{background:C.card,borderRadius:12,
          border:`1px solid ${C.border}`,marginBottom:8,overflow:'hidden'}}>
          <div onClick={()=>setExpanded(exp?null:r.m.id)}
            style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',cursor:'pointer'}}>
            <div style={{fontSize:18,fontWeight:900,color:C.dim,minWidth:28,
              fontFamily:'JetBrains Mono,monospace',textAlign:'center'}}>{i+1}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:3}}>
                <span style={{fontSize:10,background:(tc[r.m.typeLabel]||'#6b7280')+'22',
                  color:tc[r.m.typeLabel]||'#6b7280',borderRadius:4,padding:'1px 5px',
                  fontWeight:700,flexShrink:0}}>{r.m.typeLabel}</span>
                <span style={{fontSize:13,fontWeight:700,overflow:'hidden',
                  textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.m.name}</span>
              </div>
              <div style={{fontSize:11,color:C.muted}}>{r.m.memo}</div>
            </div>
            <div style={{textAlign:'center',flexShrink:0}}>
              <div style={{fontSize:22,fontWeight:900,color,fontFamily:'JetBrains Mono,monospace',lineHeight:1}}>
                {fp(r.rate)}</div>
              <div style={{fontSize:9,color,fontWeight:700,marginTop:1}}>達成確率</div>
            </div>
          </div>
          {exp&&r.successN>0&&<div style={{padding:'0 14px 14px',borderTop:`1px solid ${C.dim}`}}>
            <div style={{fontSize:11,color:C.muted,margin:'10px 0 8px'}}>
              達成した{r.successN}試行の平均出玉パターン:
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:8}}>
              {[{l:'総連チャン',v:`${r.avgChains}連`,c:C.accentL},
                ...(r.avgLT>0?[{l:'LT連チャン',v:`${r.avgLT}連`,c:C.gold}]:[]),
                ...(r.avg7500>0?[{l:'7500発以上',v:`${r.avg7500}回`,c:'#fbbf24'}]:[]),
                ...(r.avg3000>0?[{l:'3000発',v:`${r.avg3000}回`,c:C.green}]:[]),
                ...(r.avg1500>0?[{l:'1500発',v:`${r.avg1500}回`,c:C.accentL}]:[]),
              ].map(x=><div key={x.l} style={{background:C.dim,borderRadius:6,padding:'5px 6px',textAlign:'center'}}>
                <div style={{fontSize:14,fontWeight:900,color:x.c,fontFamily:'JetBrains Mono,monospace'}}>{x.v}</div>
                <div style={{fontSize:9,color:C.muted}}>{x.l}</div>
              </div>)}
            </div>
            <div style={{fontSize:11,color:'#3a3a60',lineHeight:1.7}}>
              💡 ¥{budget.toLocaleString()}→¥{target.toLocaleString()}には
              平均<strong style={{color:C.text}}>{r.avgChains}連</strong>前後が必要。
              {r.avg7500>0&&<>うち<strong style={{color:'#fbbf24'}}> 7500発×{r.avg7500}回</strong>が達成のカギ。</>}
              {r.avg3000>0&&r.avg7500===0&&<>うち<strong style={{color:C.green}}> 3000発×{r.avg3000}回</strong>が達成のカギ。</>}
            </div>
          </div>}
          {exp&&r.successN===0&&<div style={{padding:'10px 14px 14px',fontSize:12,color:C.muted,borderTop:`1px solid ${C.dim}`}}>
            5,000回試行中、達成した試行がありませんでした。
          </div>}
        </div>;
      })}
      <div style={{fontSize:11,color:'#3a3a60',textAlign:'center',lineHeight:1.8,paddingTop:8}}>
        ※ 統計的参考値です。実際の遊技結果を保証しません。<br/>
        タップで達成時の出玉パターンを確認できます。
      </div>
    </div>}
  </div>;
}

// メインアプリ
function App(){
  const [tab,setTab]=useState('sim');
  const tabs=[{k:'sim',icon:'📊',l:'投資分析'},{k:'rush',icon:'🔥',l:'RUSH継続'},{k:'rev',icon:'💹',l:'逆算'}];
  return<div style={{display:'flex',flexDirection:'column',height:'100vh',background:C.bg,overflow:'hidden'}}>
    <div style={{padding:'12px 16px 10px',borderBottom:`1px solid ${C.border}`,flexShrink:0,
      background:'linear-gradient(180deg,#0e0e2a,#07071a)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:22}}>🎰</span>
        <div>
          <div style={{fontSize:18,fontWeight:900,letterSpacing:'-.5px'}}>PachiScope</div>
          <div style={{fontSize:10,color:C.muted}}>パチンコ期待値シミュレーター · {MACHINES.length}機種収録</div>
        </div>
      </div>
    </div>
    <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,background:C.surface,flexShrink:0}}>
      {tabs.map(t=><button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:'10px 4px',
        border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:tab===t.k?700:400,
        background:'transparent',color:tab===t.k?C.accentL:C.muted,
        borderBottom:`2px solid ${tab===t.k?C.accent:'transparent'}`}}>
        <div style={{fontSize:18}}>{t.icon}</div>
        <div style={{marginTop:2}}>{t.l}</div>
      </button>)}
    </div>
    <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
      {tab==='sim'&&<SimScreen/>}
      {tab==='rush'&&<RushScreen/>}
      {tab==='rev'&&<ReverseScreen/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
