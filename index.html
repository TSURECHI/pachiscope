// ═══════════════════════════════════════════════
// モンテカルロ シミュレーションエンジン
// ═══════════════════════════════════════════════
// N=10,000試行。各試行で「投資額が尽きるか打ち止めになるまで」をシミュレーション

function runSimulation(machine, budget, exchangeRate, trials = 10000) {
  const {
    prob, rushRate, rushContRate,
    normalPayout, rushPayout, rushPayoutHigh, rushPayoutHighRate,
    hasLT, ltEntryRate, ltContRate, ltPayout,
    border,
  } = machine;

  const yenPerTama = exchangeRate.yenPerTama;
  const tamaPerYen = 1 / yenPerTama;  // 1円で何玉買えるか（等価なら0.25）
  // 等価の場合: 1000円 = 250玉発射
  const tamaPerK = 250;  // 1000円あたり発射玉数
  const rotPerK = border; // ボーダー付近（参考値）

  const results = new Float32Array(trials);

  for (let t = 0; t < trials; t++) {
    let tama = Math.floor(budget * tamaPerYen);  // 所持玉数（現金→玉）
    let totalPayout = 0;
    let inRush = false;
    let rushCount = 0;
    let inLT = false;
    let spent = 0;

    while (tama > 0) {
      // 通常時: 1000円ぶん（250玉）消化して初当りを抽選
      const rotCost = tamaPerK;  // 1kで250玉消費
      if (tama < rotCost) break;

      tama -= rotCost;
      spent += rotCost * yenPerTama;

      // 通常時の大当り抽選（1/prob）
      // 1000円でborder回転→1000円あたりの大当り期待値 = prob * border
      // より正確に: n回転で当たる確率の幾何分布をシミュレーション
      const rotations = Math.round(rotPerK);

      let hit = false;
      for (let r = 0; r < rotations; r++) {
        if (Math.random() < prob) { hit = true; break; }
      }

      if (!hit) continue;

      // 大当り処理
      if (!inRush) {
        // 通常時からの初当り
        const rushIn = Math.random() < rushRate;
        if (rushIn) {
          // RUSH突入: 初当りでまず出玉
          totalPayout += normalPayout;  // 初当り出玉
          inRush = true;
          rushCount = 0;

          if (hasLT && Math.random() < ltEntryRate) {
            inLT = true;
          }
        } else {
          // RUSH非突入: 通常出玉のみ
          totalPayout += normalPayout;
        }
      }

      // RUSH中の連チャン処理
      if (inRush) {
        // RUSH中は即座に連チャン計算（時間省略）
        let chains = 0;
        while (inRush) {
          chains++;
          // 出玉計算
          let payout = rushPayout;
          if (Math.random() < rushPayoutHighRate) {
            payout = rushPayoutHigh;
          }
          totalPayout += payout;

          // LT中なら継続率アップ
          const contRate = inLT ? ltContRate : rushContRate;
          const cont = Math.random() < contRate;

          if (!cont) {
            inRush = false;
            inLT = false;
            break;
          }

          // LT突入チャンス（RUSH中毎回）
          if (hasLT && !inLT && Math.random() < ltEntryRate) {
            inLT = true;
          }

          // コンプリート上限（9.5万発）
          if (totalPayout >= 95000) {
            inRush = false;
            inLT = false;
            break;
          }
        }
      }
    }

    // 差玉計算: 出玉 - 投資玉
    const spentTama = Math.floor(budget * tamaPerYen);
    const diffTama = totalPayout - spentTama;
    const diffYen = Math.round(diffTama * yenPerTama);
    results[t] = diffYen;
  }

  // 統計集計
  const sorted = Array.from(results).sort((a,b)=>a-b);
  const n = sorted.length;

  const pctAt = p => sorted[Math.floor(n * p)];
  const mean = results.reduce((a,b)=>a+b,0)/n;

  // ヒストグラム用にバケット分け
  const min = sorted[0], max = sorted[n-1];
  const range = max - min || 1;
  const BUCKETS = 20;
  const bucketSize = Math.ceil(range / BUCKETS / 1000) * 1000 || 1000;
  const buckets = {};
  for (const v of results) {
    const key = Math.floor(v / bucketSize) * bucketSize;
    buckets[key] = (buckets[key] || 0) + 1;
  }

  // 特定閾値以上になる確率
  const probGt = (yen) => results.filter(v=>v>=yen).length / n;

  return {
    pct5:   pctAt(0.05),
    pct25:  pctAt(0.25),
    median: pctAt(0.50),
    pct75:  pctAt(0.75),
    pct90:  pctAt(0.90),
    pct95:  pctAt(0.95),
    mean:   Math.round(mean),
    min:    sorted[0],
    max:    sorted[n-1],
    buckets,
    bucketSize,
    probGtZero:  probGt(0),
    probGt5k:    probGt(5000),
    probGt10k:   probGt(10000),
    probGt20k:   probGt(20000),
    probGt50k:   probGt(50000),
    probLoss50:  results.filter(v=>v<=-budget*0.5).length/n,
    probLossAll: results.filter(v=>v<=-budget).length/n,
    trials: n,
  };
}

    if(!q) return MACHINES;
    const lq = q.toLowerCase().replace(/[　\s]+/g,'');
    return MACHINES.filter(m=>{
      const hay = [m.name,m.short,...m.tags].join(' ').toLowerCase().replace(/[　\s]+/g,'');
      return hay.includes(lq);
    });
  },[q]);

  return (
    <div style={{position:'relative'}}>
      <div style={{position:'relative'}}>
        <div style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:16,pointerEvents:'none'}}>🔍</div>
        <input ref={ref} value={q} onChange={e=>setQ(e.target.value)}
          onFocus={()=>setFocused(true)}
          onBlur={()=>setTimeout(()=>setFocused(false),200)}
          placeholder="機種名を入力（例: リゼロ、エヴァ、牙狼...）"
          style={{width:'100%',background:C.surface,border:`1px solid ${focused?C.accent:C.border}`,
            borderRadius:12,color:C.text,padding:'12px 12px 12px 40px',fontSize:15,
            outline:'none',boxSizing:'border-box',transition:'border-color 0.2s'}}/>
      </div>
      {(focused || q) && hits.length > 0 && (
        <div style={{position:'absolute',top:'calc(100% + 6px)',left:0,right:0,zIndex:100,
          background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:'hidden',
          maxHeight:320,overflowY:'auto',boxShadow:'0 8px 32px rgba(0,0,0,0.6)'}}>
          {hits.map(m=>(
            <div key={m.id} onClick={()=>{onSelect(m);setQ('');setFocused(false);}}
              style={{padding:'12px 16px',cursor:'pointer',borderBottom:`1px solid ${C.border}`,
                transition:'background 0.1s'}}
              onMouseEnter={e=>e.target.style.background=C.dim}
              onMouseLeave={e=>e.target.style.background='transparent'}>
              <div style={{fontWeight:700,fontSize:14}}>{m.short}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:2}}>
                {m.maker} · 1/{Math.round(1/m.prob)} · {m.type}タイプ
                {m.hasLT&&<span style={{color:C.accentBright,marginLeft:6}}>LT搭載</span>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─ 分布グラフ ─
function DistributionChart({result, budget}) {
  if(!result) return null;
  const {buckets,bucketSize,trials} = result;
  const entries = Object.entries(buckets).map(([k,v])=>({x:parseInt(k),count:v})).sort((a,b)=>a.x-b.x);
  const maxCount = Math.max(...entries.map(e=>e.count));

  const barColor = x => {
    if(x>=20000) return '#10b981';
    if(x>=5000)  return '#6ee7b7';
    if(x>=0)     return '#6b6b90';
    if(x>=-budget*0.5) return '#f87171';
    return '#ef4444';
  };

  return (
    <div style={{marginTop:16}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:8,letterSpacing:'0.05em'}}>収支分布（{trials.toLocaleString()}回試行）</div>
      <div style={{display:'flex',alignItems:'flex-end',gap:2,height:80,padding:'0 4px'}}>
        {entries.map(({x,count})=>(
          <div key={x} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
            <div style={{width:'100%',background:barColor(x),borderRadius:'2px 2px 0 0',
              height:`${Math.round(count/maxCount*72)}px`,minHeight:2}}/>
          </div>
        ))}
      </div>
      {/* X軸ラベル */}
      <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:9,color:C.muted}}>
        <span>{fmtYen(entries[0]?.x)}</span>
        <span>0</span>
        <span>{fmtYen(entries[entries.length-1]?.x)}</span>
      </div>
    </div>
  );
}

// ─ パーセンタイル表示 ─
function Percentiles({result}) {
  if(!result) return null;
  const rows = [
    {label:'下位5%（大負け）',val:result.pct5,note:'ほぼ最悪の展開'},
    {label:'下位25%',val:result.pct25,note:'やや不運な展開'},
    {label:'中央値',val:result.median,note:'最もよくある結果'},
    {label:'上位25%',val:result.pct75,note:'やや恵まれた展開'},
    {label:'上位10%',val:result.pct90,note:'かなり恵まれた展開'},
    {label:'上位5%（大勝ち）',val:result.pct95,note:'ほぼ最高の展開'},
  ];

  return (
    <div style={{marginTop:16}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:8,letterSpacing:'0.05em'}}>収支パーセンタイル</div>
      {rows.map(({label,val,note})=>(
        <div key={label} style={{display:'flex',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:C.muted}}>{label}</div>
            <div style={{fontSize:10,color:'#4b4b70'}}>{note}</div>
          </div>
          <div style={{fontWeight:700,fontSize:16,fontFamily:'JetBrains Mono,monospace',
            color:val>=10000?C.green:val>=0?'#a78bfa':val>=-5000?'#94a3b8':C.red}}>
            {fmtYen(val)}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─ 確率テーブル ─
function ProbTable({result, budget}) {
  if(!result) return null;
  const rows = [
    {label:'プラス収支になる確率',val:result.probGtZero,good:true},
    {label:'5,000円以上プラス',val:result.probGt5k,good:true},
    {label:'10,000円以上プラス',val:result.probGt10k,good:true},
    {label:'20,000円以上プラス',val:result.probGt20k,good:true},
    {label:'50,000円以上プラス',val:result.probGt50k,good:true},
    {label:'投資額の50%以上溶ける',val:result.probLoss50,good:false},
    {label:'全額溶ける',val:result.probLossAll,good:false},
  ];

  return (
    <div style={{marginTop:16}}>
      <div style={{fontSize:11,color:C.muted,marginBottom:8,letterSpacing:'0.05em'}}>発生確率</div>
      {rows.map(({label,val,good})=>(
        <div key={label} style={{display:'flex',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${C.border}`}}>
          <div style={{flex:1,fontSize:12,color:C.muted}}>{label}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {/* ゲージ */}
            <div style={{width:60,height:4,background:C.dim,borderRadius:2,overflow:'hidden'}}>
              <div style={{width:`${val*100}%`,height:'100%',background:good?C.green:C.red,borderRadius:2}}/>
            </div>
            <div style={{fontWeight:700,fontSize:15,minWidth:42,textAlign:'right',
              fontFamily:'JetBrains Mono,monospace',
              color:good?(val>0.5?C.green:val>0.3?C.accentBright:C.muted):(val>0.5?C.red:val>0.3?'#f97316':C.muted)}}>
              {fmtPct(val)}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─ 機種スペックカード ─
function MachineSpec({machine}) {
  return (
    <div style={{background:C.surface,borderRadius:10,padding:'12px 14px',border:`1px solid ${C.border}`,marginBottom:16}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
        {[
          {label:`1/${Math.round(1/machine.prob)}`,desc:'大当り確率'},
          {label:`${Math.round(machine.rushRate*100)}%`,desc:'RUSH突入率'},
          {label:`${Math.round(machine.rushContRate*100)}%`,desc:'継続率'},
          ...(machine.hasLT?[{label:'LT搭載',desc:`突入${Math.round(machine.ltEntryRate*100)}%`}]:[]),
        ].map(({label,desc})=>(
          <div key={desc} style={{background:C.dim,borderRadius:8,padding:'6px 10px',textAlign:'center'}}>
            <div style={{fontSize:14,fontWeight:900,color:C.accentBright,fontFamily:'JetBrains Mono,monospace'}}>{label}</div>
            <div style={{fontSize:10,color:C.muted}}>{desc}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:12,color:'#9090b8',lineHeight:1.7}}>{machine.desc}</div>
      <div style={{fontSize:11,color:C.muted,marginTop:6}}>
        ボーダー目安: {machine.border}回/k　
        {machine.yutaiKaisu&&`遊タイム: ${machine.yutaiKaisu}回`}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// メインアプリ
// ═══════════════════════════════════════════════

export default function App() {
  const [machine, setMachine]   = useState(null);
  const [budget, setBudget]     = useState(10000);
  const [exchange, setExchange] = useState(EXCHANGE_OPTIONS[0]);
  const [result, setResult]     = useState(null);
  const [loading, setLoading]   = useState(false);

  const handleSim = useCallback(() => {
    if(!machine) return;
    setLoading(true);
    setResult(null);
    // 次のフレームで実行（UIがフリーズしないように）
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        const r = runSimulation(machine, budget, exchange, 10000);
        setResult(r);
        setLoading(false);
      }, 10);
    });
  }, [machine, budget, exchange]);

  // 機種変更時は結果をリセット
  const selectMachine = (m) => {
    setMachine(m);
    setResult(null);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:C.bg,overflow:'hidden'}}>
      {/* ヘッダー */}
      <div style={{padding:'14px 20px 10px',borderBottom:`1px solid ${C.border}`,flexShrink:0,
        background:'linear-gradient(180deg,#0a0a20,#060610)'}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8}}>
          <div style={{fontSize:20,fontWeight:900,letterSpacing:'-0.5px',color:C.text}}>🎰 PachiScope</div>
          <div style={{fontSize:11,color:C.muted}}>期待値シミュレーター</div>
        </div>
      </div>

      {/* スクロール本体 */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 16px 40px'}}>

        {/* 機種検索 */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:8,letterSpacing:'0.05em',fontWeight:600}}>
            機種を選択
          </div>
          <MachineSearch onSelect={selectMachine}/>
        </div>

        {/* 選択済み機種 */}
        {machine && <MachineSpec machine={machine}/>}

        {/* 投資額入力 */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:8,letterSpacing:'0.05em',fontWeight:600}}>
            投資額
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
            {[3000,5000,10000,15000,20000,30000,50000].map(v=>(
              <button key={v} onClick={()=>setBudget(v)} style={{
                padding:'6px 12px',borderRadius:20,border:'none',fontSize:12,fontWeight:600,
                cursor:'pointer',fontFamily:'inherit',transition:'all 0.15s',
                background:budget===v?C.accent:C.dim,
                color:budget===v?'#fff':C.muted}}>
                ¥{v>=10000?v/10000+'万':v.toLocaleString()}
              </button>
            ))}
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input type="number" value={budget} onChange={e=>setBudget(Math.max(100,parseInt(e.target.value)||0))}
              style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
                color:C.text,padding:'10px 14px',fontSize:18,fontWeight:700,
                fontFamily:'JetBrains Mono,monospace',outline:'none',boxSizing:'border-box'}}/>
            <span style={{fontSize:14,color:C.muted,flexShrink:0}}>円</span>
          </div>
        </div>

        {/* 換金率 */}
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,color:C.muted,marginBottom:8,letterSpacing:'0.05em',fontWeight:600}}>
            換金率
          </div>
          <select value={exchange.key} onChange={e=>setExchange(EXCHANGE_OPTIONS.find(x=>x.key===e.target.value))}
            style={{width:'100%',background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,
              color:C.text,padding:'10px 14px',fontSize:13,outline:'none',fontFamily:'inherit',
              boxSizing:'border-box',appearance:'none'}}>
            {EXCHANGE_OPTIONS.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
          </select>
        </div>

        {/* シミュレーションボタン */}
        <button onClick={handleSim} disabled={!machine||loading}
          style={{width:'100%',padding:'16px',border:'none',borderRadius:14,fontSize:16,fontWeight:900,
            cursor:(!machine||loading)?'not-allowed':'pointer',fontFamily:'inherit',
            background:(!machine||loading)?C.dim:`linear-gradient(135deg,${C.accent},#6d28d9)`,
            color:(!machine||loading)?C.muted:'#fff',
            boxShadow:(!machine||loading)?'none':'0 4px 20px rgba(124,58,237,0.4)',
            transition:'all 0.2s',opacity:(!machine||loading)?0.6:1}}>
          {loading ? '⏳ シミュレーション中...' : machine ? `${machine.short} を${budget.toLocaleString()}円でシミュレーション` : '機種を選択してください'}
        </button>

        {/* 結果表示 */}
        {result && (
          <div style={{marginTop:24}}>
            {/* 結論カード */}
            <div style={{background:C.card,borderRadius:16,padding:16,marginBottom:16,
              border:`1px solid ${C.border}`}}>
              <div style={{fontSize:11,color:C.muted,letterSpacing:'0.1em',marginBottom:12}}>
                📊 {machine.short} × ¥{budget.toLocaleString()} のシミュレーション結果
              </div>

              {/* メトリクス */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
                <div style={{background:C.surface,borderRadius:10,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:C.muted,marginBottom:4}}>期待収支（平均）</div>
                  <div style={{fontSize:22,fontWeight:900,fontFamily:'JetBrains Mono,monospace',
                    color:result.mean>=0?C.green:C.red}}>{fmtYen(result.mean)}</div>
                </div>
                <div style={{background:C.surface,borderRadius:10,padding:'10px 12px'}}>
                  <div style={{fontSize:10,color:C.muted,marginBottom:4}}>プラス確率</div>
                  <div style={{fontSize:22,fontWeight:900,fontFamily:'JetBrains Mono,monospace',
                    color:result.probGtZero>0.5?C.green:result.probGtZero>0.35?C.gold:C.red}}>
                    {fmtPct(result.probGtZero)}
                  </div>
                </div>
              </div>

              {/* 最悪・最良 */}
              <div style={{display:'flex',gap:8}}>
                <div style={{flex:1,background:'#1a0a0a',borderRadius:8,padding:'8px 10px',border:`1px solid ${C.red}33`}}>
                  <div style={{fontSize:9,color:C.red,marginBottom:2}}>最悪シナリオ（5%ile）</div>
                  <div style={{fontSize:15,fontWeight:700,color:C.red,fontFamily:'JetBrains Mono,monospace'}}>{fmtYen(result.pct5)}</div>
                </div>
                <div style={{flex:1,background:'#0a1a0a',borderRadius:8,padding:'8px 10px',border:`1px solid ${C.green}33`}}>
                  <div style={{fontSize:9,color:C.green,marginBottom:2}}>最良シナリオ（95%ile）</div>
                  <div style={{fontSize:15,fontWeight:700,color:C.green,fontFamily:'JetBrains Mono,monospace'}}>{fmtYen(result.pct95)}</div>
                </div>
              </div>

              <DistributionChart result={result} budget={budget}/>
            </div>

            <div style={{background:C.card,borderRadius:16,padding:16,marginBottom:16,border:`1px solid ${C.border}`}}>
              <Percentiles result={result}/>
            </div>

            <div style={{background:C.card,borderRadius:16,padding:16,marginBottom:16,border:`1px solid ${C.border}`}}>
              <ProbTable result={result} budget={budget}/>
            </div>

            {/* 免責 */}
            <div style={{fontSize:11,color:'#4b4b70',textAlign:'center',lineHeight:1.8,padding:'8px 0'}}>
              ※ このシミュレーションは統計的な参考値です。<br/>
              ボーダー付近の回転率・釘状態を前提としています。<br/>
              実際の遊技結果を保証するものではありません。
            </div>
          </div>
        )}

        {/* 使い方 */}
        {!machine && (
          <div style={{marginTop:24,background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>使い方</div>
            {[
              {icon:'①', text:'機種名を検索（「リゼロ」「エヴァ」等）'},
              {icon:'②', text:'今日の投資額を入力'},
              {icon:'③', text:'お店の換金率を選択'},
              {icon:'④', text:'シミュレーション開始 → 収支分布を確認'},
            ].map(({icon,text})=>(
              <div key={icon} style={{display:'flex',gap:10,padding:'7px 0',borderBottom:`1px solid ${C.dim}`}}>
                <span style={{color:C.accentBright,fontWeight:700,flexShrink:0}}>{icon}</span>
                <span style={{fontSize:13,color:C.muted}}>{text}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
</script>
